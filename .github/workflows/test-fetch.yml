name: Test - veri cekimi

# Elle tetiklenir: Actions sekmesi -> bu workflow -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Calisma modu"
        type: choice
        default: "dry-run"
        options:
          - dry-run      # sadece dene, kaydetme
          - full         # tam cekim, parquet'i repoya commit et

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # parquet'i commit edebilmek icin

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Anahtar tanimli mi kontrol et
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY secret'i tanimli degil."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          echo "FRED_API_KEY tanimli (${#FRED_API_KEY} karakter)"

      - name: Veri cek
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            python src/fetch.py --full --dry-run
          else
            python src/fetch.py --full
          fi

      - name: Siniflandir
        if: inputs.mode == 'full'
        run: python src/classify.py data/history.parquet config/thresholds.yaml

      - name: Sonucu repoya yaz
        if: inputs.mode == 'full'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/history.parquet
          if git diff --staged --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Veri guncellemesi $(date -u +%Y-%m-%d)"
            git push
          fi
